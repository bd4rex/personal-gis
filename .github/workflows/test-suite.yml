name: Test suite

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    name: Static repository contracts
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run static test profile
        shell: powershell
        run: .\tests\run-suite.ps1 -Profile static
